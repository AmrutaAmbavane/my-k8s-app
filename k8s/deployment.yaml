apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8s-app
  labels:
    app: my-k8s-app
spec:
  replicas: 2          # simulates AKS scaling
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
    spec:
      containers:
      - name: my-k8s-app
        image: my-k8s-app:v1
        imagePullPolicy: Never   # use local image
        ports:
        - containerPort: 3000